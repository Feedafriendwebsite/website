<style>
:root{--cream:#F5F1E9;--paper:#F8F5EF;--ink:#1C2A22;--green:#0E6B46;--deep:#174A33;--gold:#C9A45C;--goldtxt:#8A6A2F;--line:#E4DDD0;--mute:#5B6960;--mute2:#6E7B73;--faint:#8C8577;--warn:#9A5A4A;
  --serif:'Cormorant Garamond','Noto Naskh Arabic',serif;--sans:Jost,'Noto Naskh Arabic',Helvetica,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:var(--ink)}a:hover{color:var(--goldtxt)}
button{font-family:var(--sans)}
em{font-style:italic}
@keyframes stampIn{0%{transform:translate(-50%,-50%) scale(1.9) rotate(-18deg);opacity:0}60%{transform:translate(-50%,-50%) scale(.92) rotate(4deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.2);opacity:0}}
@keyframes radiate{0%{box-shadow:0 0 0 0 rgba(127,196,160,.75)}70%{box-shadow:0 0 0 12px rgba(127,196,160,0)}100%{box-shadow:0 0 0 0 rgba(127,196,160,0)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
main{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--paper);min-height:100vh}
.eb{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--goldtxt)}
html[dir=rtl] .eb,html[dir=rtl] .tag,html[dir=rtl] .lbl{letter-spacing:0}
.serif{font-family:var(--serif)}
.hidden{display:none!important}
/* top banner + language */
.topbar{display:flex;justify-content:center;align-items:center;gap:8px;padding:8px 12px;white-space:nowrap;background:var(--deep);color:#F0DDB2;text-decoration:none;font-size:10px;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.topbar:hover{color:#fff}.topbar i{width:4px;height:4px;border-radius:50%;background:var(--gold);flex:none}.topbar b{font-weight:400;color:var(--paper)}
html[dir=rtl] .topbar{letter-spacing:0;font-size:13px}
.langrow{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:6px 20px 0;font-size:11px}
.langrow button{background:none;border:0;padding:0 0 1px;cursor:pointer;text-decoration:none}
.langrow .en{letter-spacing:.08em;font-family:var(--sans);color:#8C8577}
.langrow .ar{font-size:13px;font-family:'Noto Naskh Arabic',serif;color:#8C8577}
.langrow .on{color:var(--ink);border-bottom:1px solid var(--green)}
.langrow .dot{color:#CFC6B5}
/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 20px 14px;border-bottom:1px solid var(--line)}
header .l{display:flex;flex-direction:column;gap:6px;min-width:0}
header .k{font-size:11px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--green)}
html[dir=rtl] header .k{letter-spacing:.04em;font-size:13px}
header .t{font-family:var(--serif);font-size:23px;font-weight:500;line-height:1;letter-spacing:-.005em}
html[dir=rtl] header .t{line-height:1.25}
header .t em{font-weight:400;color:var(--green)}
header .s{font-size:12px;letter-spacing:.04em;color:var(--mute2)}
header .logos{display:flex;align-items:center;gap:10px;flex:none}header .logos img{height:auto;flex:none}header .logos .lt{width:54px}header .logos img:not(.lt){width:58px}
/* live ticker */
.ticker{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));align-items:center;gap:8px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line)}
.ticker .live{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--green)}
html[dir=rtl] .ticker .live{letter-spacing:0}
.ticker .live i,.imp .live i{width:9px;height:9px;border-radius:50%;background:var(--green);animation:radiate 1.8s ease-out infinite;flex:none}
.ticker .c{display:flex;flex-direction:column;border-inline-start:1px solid var(--line);padding-inline-start:10px;min-width:0}
.ticker .c b{font-family:var(--serif);font-size:22px;font-weight:400;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.ticker .c span{font-size:10px;letter-spacing:.06em;color:var(--mute2);line-height:1.25;margin-top:2px}
/* check-in */
.checkin{padding:12px 20px 18px;display:flex;flex-direction:column;gap:8px;animation:rise .7s ease both}
.checkin .eb{font-size:10px;letter-spacing:.2em}
.checkin h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(28px,8.4vw,38px);line-height:1.05;letter-spacing:-.01em;text-wrap:balance;color:var(--ink)}
html[dir=rtl] .checkin h1{line-height:1.3}
.checkin h1 em{color:var(--green)}
.checkin p.sub{margin:0;font-size:14px;line-height:1.5;font-weight:300;color:#3D4B43;text-wrap:pretty;max-width:42ch}
.user{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.user .av{width:26px;height:26px;border-radius:50%;background:var(--green);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:15px;flex:none}
.user strong{font-weight:500;color:var(--ink)}
.user button{margin-inline-start:auto;background:none;border:0;padding:4px 0;font-size:12px;color:var(--goldtxt);text-decoration:underline;cursor:pointer}
.acts{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.btn{height:46px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--green);color:var(--paper);border:0;font-size:14px;letter-spacing:.06em;cursor:pointer;text-decoration:none;border-radius:0}
.btn:hover{background:var(--deep);color:var(--paper)}
.btn[disabled]{opacity:.6;cursor:default}
.btn.full{width:100%;height:54px;font-size:15px}
.btn.gold{background:var(--gold);color:var(--ink)}.btn.gold:hover{background:#D4B06A;color:var(--ink)}
.ulink{background:none;border:0;padding:0;font-size:13px;color:var(--ink);text-decoration:underline;cursor:pointer}
.prog{display:flex;align-items:center;gap:14px;padding-top:4px}
.prog .bar{flex:1;height:2px;background:var(--line);position:relative}
.prog .bar i{position:absolute;inset:0 auto 0 0;background:#B8924A;transition:width .8s ease;width:0}
html[dir=rtl] .prog .bar i{inset:0 0 0 auto}
.prog .n{font-family:var(--serif);font-size:22px;white-space:nowrap}
.prog .n b{font-weight:400;color:var(--green)}.prog .n span{color:#A9A294}
/* map */
.mapwrap{margin:4px -20px 0;display:flex;flex-direction:column;gap:10px}
.map{position:relative;width:100%;aspect-ratio:470/290;background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map .place{position:absolute;inset-inline-start:4%;top:7%;font-family:var(--serif);font-style:italic;font-size:15px;color:#A9A294;letter-spacing:.06em}
.pin{position:absolute;width:0;height:0}
.pin .ring{position:absolute;left:0;top:0;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:1px solid #B8924A;opacity:0}
.pin .dot{position:absolute;left:0;top:0;width:36px;height:36px;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff}
.pin .dot span{font-family:var(--serif);font-size:18px;line-height:1}
.pin .lab{position:absolute;left:0;transform:translateX(-50%);width:92px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.pin .lab small{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
html[dir=rtl] .pin .lab small{letter-spacing:0;font-size:10px}
.pin .lab b{font-weight:400;font-size:11px;color:var(--ink);line-height:1.15}
.mapwrap p{margin:0;padding:0 20px;font-size:13px;line-height:1.55;color:var(--mute)}
/* gold banner */
.banner{margin:0 0 20px;padding:18px 20px;background:var(--gold);color:var(--ink);text-decoration:none;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;position:relative}
.banner:hover{background:#D4B06A;color:var(--ink)}
.banner:before{content:"";position:absolute;inset:5px;border:1px solid #1C2A2233;pointer-events:none}
.banner .d{display:flex;flex-direction:column;align-items:center;padding-inline-end:16px;border-inline-end:1px solid #1C2A2244}
.banner .d small{font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.banner .d b{font-family:var(--serif);font-size:30px;font-weight:400;line-height:1;font-variant-numeric:lining-nums}
.banner .m{display:flex;flex-direction:column;gap:2px}
.banner .m small{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#4A3A18}
.banner .m b{font-family:var(--serif);font-size:21px;font-weight:400;line-height:1.1}
.banner .m span{font-size:12px}
html[dir=rtl] .banner .d small,html[dir=rtl] .banner .m small{letter-spacing:0;font-size:11px}
html[dir=rtl] .banner .arr{transform:scaleX(-1)}
/* passport */
.pass{margin:0 16px 20px;padding:26px 22px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;position:relative}
.pass.gift{background:var(--green);color:var(--cream);border:0}
.pass.gift:before{content:"";position:absolute;inset:8px;border:1px solid #D7B878;pointer-events:none}
.pass .hi{font-family:var(--serif);font-size:30px;line-height:1.05}
.pass .lbl{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--goldtxt)}
.pass.gift .lbl{color:#D5E2D8}
.pass .codebox{display:flex;flex-direction:column;gap:4px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pass.gift .codebox{border-color:#6E9579}
.pass .code{font-family:var(--serif);font-size:42px;letter-spacing:.12em;color:var(--green);direction:ltr;text-align:start;line-height:1.1}
html[dir=rtl] .pass .code{text-align:right}
.pass.gift .code{color:#F0DDB2}
.pass .note{margin:0;font-size:14px;line-height:1.6;font-weight:300;color:#3D4B43}
.pass.gift .note{color:#E8EFEA}
.pass .note b{font-weight:500}
.pass .fine{margin:0;font-size:12px;line-height:1.5;color:var(--faint)}
.pass.gift .fine{color:#D5E2D8}
/* impact */
.imp{padding:34px 20px;background:var(--deep);color:var(--paper);display:flex;flex-direction:column;gap:22px}
.imp .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.imp .top .eb{color:#D7B878;font-size:11px}
.imp .live{display:flex;align-items:center;gap:9px;padding:6px 12px;border:1px solid #7FC4A0;font-size:13px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:#CFEBD9}
html[dir=rtl] .imp .live{letter-spacing:0}
.imp .live i{width:10px;height:10px;background:#7FC4A0}
.imp .big{font-family:var(--serif);font-size:clamp(64px,24vw,104px);line-height:1;color:#F0DDB2;font-variant-numeric:lining-nums tabular-nums}
.imp .bl{font-size:14px;letter-spacing:.04em;color:#C6CFC8}
.imp .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid #2F6349}
.imp .grid div{display:flex;flex-direction:column;gap:6px;padding:16px 12px 14px 0;border-bottom:1px solid #2F6349}
html[dir=rtl] .imp .grid div{padding:16px 0 14px 12px}
.imp .grid b{font-family:var(--serif);font-weight:400;font-size:clamp(30px,9.4vw,44px);line-height:1;font-variant-numeric:lining-nums tabular-nums}
.imp .grid b small{font-size:20px;color:#D7B878}
.imp .grid span{font-size:14px;line-height:1.45;color:#C6CFC8}
.imp .est{margin:0;font-size:11px;line-height:1.5;color:#93A598}
/* journey */
.journey{padding:52px 20px 14px;display:flex;flex-direction:column;gap:26px}
.journey h2{margin:0;font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.1}
html[dir=rtl] .journey h2{line-height:1.3}
.journey h2 em{color:var(--green)}
.journey p{margin:10px 0 0;font-size:15px;line-height:1.6;font-weight:300;color:#3D4B43}
.chap{display:grid;grid-template-columns:44px 1fr;gap:14px}
.chap .rail{display:flex;flex-direction:column;align-items:center}
.chap .rn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:18px}
.chap .ln{flex:1;width:1px;background:#DCD3C2}
.chap .tx{display:flex;flex-direction:column;gap:6px;padding:6px 0 26px}
.chap .tg{font-size:10px;letter-spacing:.22em;text-transform:uppercase}
html[dir=rtl] .chap .tg{letter-spacing:0;font-size:12px}
.chap .ti{font-family:var(--serif);font-size:24px;line-height:1.1}
html[dir=rtl] .chap .ti{line-height:1.3}
.chap .bd{font-size:14px;line-height:1.6;font-weight:300;color:#3D4B43;text-wrap:pretty}
.chap.lock .bd{filter:blur(5px);user-select:none}
/* FAF block */
.souq{margin:36px 0 0;padding:52px 22px 44px;background:var(--deep);color:var(--paper);display:flex;flex-direction:column;gap:24px;position:relative;overflow:hidden}
.souq .r1,.souq .r2,.souq .r3{position:absolute;border-radius:50%;inset-inline-end:-120px;top:-120px;width:340px;height:340px;border:1px solid #2F6349}
.souq .r2{inset-inline-end:-70px;top:-70px;width:240px;height:240px}
.souq .r3{inset-inline-end:-20px;top:-20px;width:140px;height:140px;border-color:#B8924A}
.souq .eb{color:#D7B878;position:relative}
.souq h2{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(40px,12vw,56px);line-height:.95;letter-spacing:-.015em;position:relative}
html[dir=rtl] .souq h2{line-height:1.2}
.souq h2 em{color:#F0DDB2}
.souq p{margin:0;font-size:16px;line-height:1.6;font-weight:300;color:#DFE6E1;position:relative;max-width:36ch}
.souq .next{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:18px 0;border-top:1px solid #2F6349;border-bottom:1px solid #2F6349;position:relative}
.souq .next small{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#D7B878}
html[dir=rtl] .souq .next small{letter-spacing:0}
.souq .next b{font-family:var(--serif);font-weight:400;font-size:28px;text-align:end}
.souq .chips{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.souq .chips span{padding:9px 14px;border:1px solid #637A6C;font-size:12px;letter-spacing:.06em;color:#DFE6E1}
.souq .chips span.g{border-color:#B8924A;color:#F0DDB2}
/* why */
.why{padding:40px 20px;background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.why p.q{margin:0;font-family:var(--serif);font-size:30px;line-height:1.15;text-wrap:balance}
html[dir=rtl] .why p.q{line-height:1.4}
.why p.q em{color:var(--green)}
.why p.b{margin:0;font-size:15px;line-height:1.65;font-weight:300;color:#3D4B43}
.why .tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid #EDE7DB;padding-top:16px;gap:10px}
.why .tri b{display:block;font-family:var(--serif);font-weight:400;font-size:20px}
.why .tri span{font-size:12px;color:var(--mute2);line-height:1.4;display:block;margin-top:4px}
/* partners + privacy */
.partners{padding:36px 20px 34px;background:#fff;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:26px}
.partners .two{display:grid;grid-template-columns:1fr 1fr;width:100%}
.partners .two>div{display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 8px;text-align:center}
.partners .two>div+div{border-inline-start:1px solid var(--line)}
.partners small{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--faint)}
html[dir=rtl] .partners small{letter-spacing:0;font-size:12px}
.partners img{height:60px;width:auto;max-width:140px;object-fit:contain}
.partners .wm{font-family:var(--serif);font-size:34px;letter-spacing:.16em;line-height:60px;height:60px;text-transform:uppercase}
.partners .tfg{text-align:center;font-size:13px;color:var(--mute)}
.privacy{padding:26px 20px 38px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.privacy .eb{color:var(--mute2);letter-spacing:.24em}
html[dir=rtl] .privacy .eb{letter-spacing:0}
.privacy p{margin:0;font-size:13px;line-height:1.65;color:var(--mute)}
/* sheets */
.ov{position:fixed;inset:0;z-index:40;background:rgba(22,39,28,.6);display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.ov.mid{align-items:center;padding:20px}
.panel{width:100%;max-width:520px;max-height:94vh;overflow:auto;background:var(--paper);padding:26px 22px 30px;display:flex;flex-direction:column;gap:18px;animation:rise .35s ease both}
.panel .hd{display:flex;justify-content:space-between;align-items:center}
.x{width:36px;height:36px;border:1px solid #D8CDB8;border-radius:50%;background:transparent;font-size:16px;color:var(--ink);cursor:pointer;flex:none}
.panel h2{margin:0;font-family:var(--serif);font-weight:400;font-size:38px;line-height:1}
html[dir=rtl] .panel h2{line-height:1.3}
.panel h2 em{color:var(--green)}
.panel p.lead{margin:10px 0 0;font-size:14px;line-height:1.6;font-weight:300;color:#3D4B43}
.fld{display:flex;flex-direction:column;gap:6px}
.fld span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute2)}
html[dir=rtl] .fld span{letter-spacing:0;font-size:13px}
.fld input,.inp{height:50px;padding:0 14px;border:1px solid #D8CDB8;background:#fff;font-family:var(--sans);font-size:16px;color:var(--ink);outline:none;border-radius:0;width:100%}
.fld input:focus,.inp:focus{border-color:var(--green)}
.otp{height:64px;font-family:var(--serif);font-size:36px;letter-spacing:.5em;text-align:center}
.consent{display:flex;align-items:flex-start;gap:12px;padding:4px 0;font-size:13px;line-height:1.5;color:#3D4B43;cursor:pointer}
.consent input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--green)}
.err{font-size:13px;color:var(--warn);min-height:0}
.err:empty{display:none}
.fine{font-size:11px;line-height:1.5;color:var(--faint);text-align:center;margin:0}
.fine a{color:var(--green)}
.center{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.stampcard{width:100%;max-width:380px;max-height:92vh;overflow:auto;background:var(--paper);padding:30px 24px;text-align:center;animation:pop .35s ease;position:relative}
.stampcard:before{content:"";position:absolute;inset:6px;border:1px solid #C9A45C88;pointer-events:none}
.stampcard .big{width:84px;height:84px;border-radius:50%;background:var(--green);color:var(--paper);border:1px solid #B8924A;box-shadow:0 0 0 4px var(--paper),0 0 0 5px #B8924A;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:44px;margin:0 auto 16px}
.stampcard h2{margin:0;font-family:var(--serif);font-weight:400;font-size:34px;line-height:1}
.stampcard h2 em{color:var(--green)}
.stampcard p{margin:10px 0 18px;font-size:14px;line-height:1.6;font-weight:300;color:#3D4B43}
.stampcard p b{font-weight:500;color:var(--ink)}
.stampcard .eb{display:block;margin-bottom:16px}
.quiz{margin:0 0 16px;padding:14px 0 0;border-top:1px solid var(--line);text-align:start}
.quiz .qk{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--goldtxt)}
html[dir=rtl] .quiz .qk{letter-spacing:0;font-size:12px}
.quiz .qt{font-family:var(--serif);font-size:22px;line-height:1.15;margin:6px 0 10px}
html[dir=rtl] .quiz .qt{line-height:1.4}
.quiz .qo{display:flex;flex-direction:column;gap:8px}
.quiz .qo button{min-height:44px;padding:8px 14px;border:1px solid #D8CDB8;background:#fff;font-size:15px;color:var(--ink);text-align:start;cursor:pointer;border-radius:0}
.quiz .qo button:hover{border-color:var(--green)}
.quiz .qo button.good{background:var(--green);color:var(--paper);border-color:var(--green)}
.quiz .qo button.bad{border-color:var(--warn);color:var(--warn)}
.quiz .qo button[disabled]{cursor:default}
.quiz .qf{margin:10px 0 0!important;font-size:13px!important;line-height:1.5}
@media (min-width:600px){main{border-inline:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>

/* ---------- state ---------- */
var lang='en', me=null, local=[], busy=false, freshStop=0, lastScanned=0;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function t(k){return S[lang][k]}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(id){return document.getElementById(id)}
function ttl(a){return esc(a[0])+' <em>'+esc(a[1])+'</em>'}

/* ---------- api ---------- */
function rpc(fn,body){
  return fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})})
   .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json()});
}

/* ---------- FAF days: opening day, then first Saturday of each month (computed) ---------- */
function nextFaf(){
  var n=new Date(Date.now()+3*3600e3); // Qatar
  var today=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate());
  var open=Date.UTC(2026,10,14);
  if(today<=open)return new Date(open);
  for(var k=0;k<14;k++){
    var b=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth()+k,1));
    var off=(6-b.getUTCDay()+7)%7;
    var d=Date.UTC(b.getUTCFullYear(),b.getUTCMonth(),1+off);
    if(d>=today)return new Date(d);
  }
  return new Date(open);
}
function fafText(){var d=nextFaf(),L=S[lang];return L.dateFmt(d.getUTCDate(),L.days[d.getUTCDay()],L.months[d.getUTCMonth()])}

/* ---------- map geometry (same curve as the Gewan trail, 4 pins) ---------- */
function bez(a,b,c,d,u){var v=1-u;return v*v*v*a+3*v*v*u*b+3*v*u*u*c+u*u*u*d}
var PIN_POS=(function(){
  var s1=[[-10,215],[100,230],[140,70],[235,142]],s2=[[235,142],[330,214],[370,70],[480,78]];
  function at(s,u){return [bez(s[0][0],s[1][0],s[2][0],s[3][0],u),bez(s[0][1],s[1][1],s[2][1],s[3][1],u)]}
  return [at(s1,.34),at(s1,.8),at(s2,.3),at(s2,.78)];
})();
var BELOW=[false,true,false,true];

/* ---------- rendering ---------- */
function visited(){return me?me.visited:local}
function renderStatic(){
  var L=S[lang];
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  var els=document.querySelectorAll('[data-i]');
  for(var i=0;i<els.length;i++){var v=t(els[i].getAttribute('data-i'));if(typeof v==='string')els[i].textContent=v}
  $('lEn').className='en'+(lang==='en'?' on':'');$('lAr').className='ar'+(lang==='ar'?' on':'');
  $('hT').innerHTML=lang==='ar'?'تربة × فيد أ فريند<br><em>درب الكتب المحبوبة</em>':'Torba × Feed a Friend<br><em>Preloved Book Trail</em>';
  $('joinH').innerHTML=ttl(L.joinTitle);$('restoreH').innerHTML=ttl(L.restoreTitle);$('otpH').innerHTML=ttl(L.otpTitle);
  $('jH').innerHTML=ttl(L.jH);
  $('fH').innerHTML=esc(L.fH[0])+'<br>'+L.fH[1];
  $('wQ').innerHTML=L.wQ;
  var d=nextFaf();
  $('nextDay').textContent=fafText();
  $('bnM').textContent=L.mon[d.getUTCMonth()];$('bnD').textContent=String(d.getUTCDate());
  $('barB').textContent=fafText();
}
function renderHero(){
  var L=S[lang],v=visited(),n=v.length,eye,h,sub;
  if(n>=STOPS){eye=L.eyeDone;h=L.hDone;sub=L.subDone}
  else if(n>0){eye=L.eyeGoing;h=L.hGoing;sub=L.subGoing(n,STOPS-n)}
  else{eye=L.eyeIdle;h=L.hIdle;sub=L.subIdle}
  if(lastScanned&&n<STOPS){eye=L.stops[lastScanned-1].n}
  $('eyebrow').textContent=eye;$('heroH').innerHTML=ttl(h);$('heroSub').textContent=sub;
  $('userRow').classList.toggle('hidden',!me);$('guestActs').classList.toggle('hidden',!!me);
  if(me){$('userAv').textContent=(me.first||'?').charAt(0).toUpperCase();$('userTxt').innerHTML=L.savedFor(esc(me.first))}
  $('mainCta').textContent=L.startCta;
  $('progBar').style.width=(n/STOPS*100)+'%';
  $('progN').innerHTML='<b>'+n+'</b><span>'+esc(L.ofSuffix)+'</span>';
  $('progTxt').textContent=L.of(n);
  $('passNote').textContent=n>=STOPS?L.passNoteDone:L.passNote;
}
function renderMap(){
  var v=visited(),L=S[lang],rtl=lang==='ar',first=0,h='';
  for(var k=1;k<=STOPS;k++){if(v.indexOf(k)<0){first=k;break}}
  for(var i=0;i<STOPS;i++){
    var num=i+1,on=v.indexOf(num)>-1,isNew=on&&freshStop===num;
    var x=PIN_POS[i][0]/470*100,y=PIN_POS[i][1]/290*100;if(rtl)x=100-x;
    var dot='background:'+(on?'#0E6B46':'#FFFFFF')+';color:'+(on?'#F8F5EF':'#8C8577')+';border:'+(on?'1px solid #B8924A':'1px dashed #B9AE99')+(isNew?';animation:stampIn .7s cubic-bezier(.2,.8,.3,1) both':'');
    var ring=(!on&&num===first&&v.length<STOPS)?'animation:pulse 2s ease-out infinite':'';
    h+='<div class="pin" style="left:'+x+'%;top:'+y+'%"><div class="ring" style="'+ring+'"></div><div class="dot" style="'+dot+'"><span>'+(on?'✓':num)+'</span></div>'+
       '<div class="lab" style="top:'+(BELOW[i]?'24px':'-54px')+'"><small>'+(rtl?'':'Nook ')+num+'</small><b>'+esc(L.stops[i].n)+'</b></div></div>';
  }

  $('mapSvg').style.transform=rtl?'scaleX(-1)':'none';
}
function renderChapters(){
  var L=S[lang],v=visited();
  $('chapters').innerHTML=L.stops.map(function(s,i){
    var on=v.indexOf(i+1)>-1,last=i===STOPS-1;
    return '<div class="chap'+(on?'':' lock')+'"><div class="rail"><div class="rn" style="border:'+(on?'1px solid #0E6B46':'1px dashed #CFC6B5')+';background:'+(on?'#0E6B46':'#F8F5EF')+';color:'+(on?'#F8F5EF':'#A9A294')+'">'+ROMAN[i]+'</div>'+(last?'':'<div class="ln"></div>')+'</div>'+
      '<div class="tx"><span class="tg" style="color:'+(on?'#0E6B46':'#A9A294')+'">'+esc(on?L.unlockedTag(i+1):L.lockedTag(i+1))+'</span><span class="ti" style="color:'+(on?'#1C2A22':'#8C8577')+'">'+esc(s.n)+'</span><span class="bd">'+esc(s.d)+'</span></div></div>';
  }).join('');
  // kept for the stop-name list some tests/tools read
}
function renderPass(){
  var on=!!me;
  $('passSec').classList.toggle('hidden',!on);
  if(on){$('sheetOv').classList.remove('show')}
  if(!on)return;
  var L=S[lang],n=me.visited.length,done=n>=STOPS||!!me.collected,g;
  if(me.collected)g=L.giftDone(esc(me.collected));
  else if(n>=STOPS)g=L.giftWait(esc(fafText()));
  else g=esc(L.giftProg(STOPS-n));
  $('passSec').className='pass'+(done?' gift':'');
  $('passCard').innerHTML='<div class="hi">'+esc(L.hi(me.first))+'</div><div class="codebox"><span class="lbl">'+esc(L.passLbl)+'</span><div class="code">'+esc(me.code)+'</div></div><p class="note">'+g+'</p><p class="fine">'+esc(L.showCode)+'</p>';
}
function renderAll(){renderStatic();renderHero();renderMap();renderChapters();renderPass()}
function fmt(n){return Math.round(Number(n)||0).toLocaleString('en-US')}
function setStats(s){
  var books=Number(s&&s.logged)||0;
  $('sBooks').textContent=fmt(books);$('iBooks').textContent=fmt(books);
  var pages=Math.round(books*PAGES_PER_BOOK),co2=Math.round(books*CO2_PER_BOOK);
  $('sPages').textContent=pages>=10000?(Math.round(pages/100)/10)+'k':fmt(pages);
  $('sCo2').textContent=fmt(co2);
  $('iPages').textContent=fmt(pages);$('iCo2').innerHTML=fmt(co2)+'<small> kg</small>';
  $('iExp').textContent=fmt(s&&s.visitors);$('iDone').textContent=fmt(s&&s.completed);
}

/* ---------- celebration: confetti + chime on a correct answer ---------- */
var audioCtx=null;
function chime(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();
    var now=audioCtx.currentTime+0.02,notes=[523.25,659.25,783.99,1046.5];
    notes.forEach(function(f,i){
      var t0=now+i*0.11,o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.13,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+(i===3?1.1:0.55));
      o.connect(g);g.connect(audioCtx.destination);o.start(t0);o.stop(t0+1.2);
    });
  }catch(e){}
}
function confetti(x,y){
  try{
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    var c=document.createElement('canvas'),dpr=Math.min(window.devicePixelRatio||1,2),W=innerWidth,H=innerHeight;
    c.width=W*dpr;c.height=H*dpr;c.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:99999';
    document.body.appendChild(c);var g=c.getContext('2d');g.scale(dpr,dpr);
    var cols=['#0E6B46','#C9A45C','#F0DDB2','#174A33','#7FC4A0','#B8924A'],ps=[],i;
    for(i=0;i<120;i++){var a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.1,v=6+Math.random()*9;
      ps.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:5+Math.random()*6,h:3+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length]})}
    var t0=performance.now(),DUR=2400;
    (function frame(now){
      var el=now-t0;g.clearRect(0,0,W,H);
      for(var k=0;k<ps.length;k++){var q=ps[k];q.vy+=.28;q.vx*=.985;q.x+=q.vx;q.y+=q.vy;q.r+=q.vr;
        g.save();g.globalAlpha=Math.max(0,1-Math.max(0,el-1500)/(DUR-1500));g.translate(q.x,q.y);g.rotate(q.r);g.fillStyle=q.c;g.fillRect(-q.w/2,-q.h/2,q.w,q.h);g.restore()}
      if(el<DUR)requestAnimationFrame(frame);else if(c.parentNode)c.parentNode.removeChild(c);
    })(t0);
  }catch(e){}
}
function celebrate(el){
  var r=el&&el.getBoundingClientRect?el.getBoundingClientRect():null;
  confetti(r?r.left+r.width/2:innerWidth/2,r?r.top+r.height/2:innerHeight/2);chime();
}

/* ---------- sheets ---------- */
function openSheet(mode){
  var reg=mode!=='restore';
  $('join').classList.toggle('hidden',!reg);$('restoreSec').classList.toggle('hidden',reg);
  if(!reg){$('rStep1').classList.remove('hidden');$('rStep2').classList.add('hidden')}
  $('shEyebrow').textContent=reg?t('shReg'):t('shRestore');
  $('sheetOv').classList.add('show');
}
function closeSheetOv(){$('sheetOv').classList.remove('show')}
function showStamp(html){$('sheet').innerHTML=html;$('modal').classList.add('show')}
function closeSheet(){$('modal').classList.remove('show')}
function stampSheet(stop,all,savedFirst){
  var L=S[lang],s=L.stops[stop-1];
  var msg=all?L.unlock:esc(s.t);
  var extra=savedFirst?'<p><b>'+esc(L.saveFirst)+'</b></p>':'';
  var q=s.q,quiz='';
  if(q){quiz='<div class="quiz" id="quiz"><span class="qk">'+esc(L.quizK)+'</span><div class="qt">'+esc(q.t)+'</div><div class="qo">'+q.o.map(function(o,i){return '<button type="button" data-k="'+i+'">'+esc(o)+'</button>'}).join('')+'</div><p class="qf" id="qf"></p></div>'}
  showStamp('<span class="eb">'+(lang==='ar'?'':'Nook ')+stop+' · '+esc(s.n)+'</span><div class="big">'+stop+'</div><h2>'+ttl(L.stamp)+'</h2><p>'+msg+'</p>'+quiz+extra+'<button class="btn full" id="sheetOk" type="button">'+esc(savedFirst?L.startCta:L.stampBtn)+'</button>');
  $('sheetOk').onclick=function(){closeSheet();if(savedFirst)openSheet('register');window.scrollTo(0,0)};
  if(q){var bs=$('quiz').querySelectorAll('.qo button');
    for(var b=0;b<bs.length;b++)bs[b].onclick=function(){
      var k=+this.getAttribute('data-k'),right=q.a<0||k===q.a;
      for(var j=0;j<bs.length;j++){bs[j].disabled=true;if(q.a>=0&&j===q.a)bs[j].className='good'}
      if(q.a<0)this.className='good';else if(!right)this.className='bad';
      $('qf').textContent=right?q.ok:q.no;if(right)celebrate(this);
    }}
}

/* ---------- actions ---------- */
function setMe(j){me={token:j.token,first:j.first,code:j.code,email:j.email,mobile:j.mobile,consent:j.consent,collected:j.collected,visited:j.visited||[]};ls('tb_token',j.token);ls('tb_local',null);local=[]}
function addLocal(n){if(local.indexOf(n)<0){local.push(n);local.sort();ls('tb_local',JSON.stringify(local))}}

function handleStop(n){
  if(!(n>=1&&n<=STOPS))return Promise.resolve();
  lastScanned=n;
  if(me){
    return rpc('tb_checkin',{p_token:me.token,p_stop:n}).then(function(j){
      if(j.status==='ok'){var had=me.visited.indexOf(n)>-1;setMe(j);freshStop=had?0:n;renderAll();stampSheet(n,me.visited.length>=STOPS,false)}
    }).catch(function(){addLocal(n);freshStop=n;renderAll();stampSheet(n,false,false)});
  }
  var had2=local.indexOf(n)>-1;addLocal(n);freshStop=had2?0:n;renderAll();stampSheet(n,false,true);return Promise.resolve();
}

function register(e){
  e.preventDefault();if(busy)return;
  var first=$('fFirst').value.trim(),mob=$('fMobile').value.replace(/\D/g,''),em=$('fEmail').value.trim(),err=$('regErr');
  if(!first){err.textContent=t('eName');$('fFirst').focus();return}
  if(mob.length===11&&mob.indexOf('974')===0)mob=mob.slice(3);
  if(!/^[0-9]{8}$/.test(mob)){err.textContent=t('eMobile');$('fMobile').focus();return}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){err.textContent=t('eEmail');$('fEmail').focus();return}
  err.textContent='';busy=true;$('regBtn').disabled=true;$('regBtn').textContent=t('sending');
  rpc('tb_register',{p_first:first,p_mobile:mob,p_email:em,p_consent:$('fConsent').checked,p_visited:local,p_lang:lang}).then(function(j){
    if(j.status==='ok'){setMe(j);freshStop=0;renderAll();closeSheetOv();window.scrollTo(0,0);if(me.visited.length>=STOPS)stampSheet(me.visited[me.visited.length-1],true,false)}
    else if(j.status==='exists'){err.textContent=t('eExists');openSheet('restore')}
    else err.textContent=(j.status==='invalid')?t('eMobile'):t('eNet');
  }).catch(function(){err.textContent=t('eNet')}).then(function(){busy=false;$('regBtn').disabled=false;$('regBtn').textContent=t('regBtn')});
}
var restoreEmail='';
function restoreSend(){
  var em=$('rEmail').value.trim(),err=$('rErr1');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){err.textContent=t('eEmail');return}
  err.textContent='';$('rSend').disabled=true;restoreEmail=em;
  rpc('tb_restore_start',{p_email:em,p_lang:lang}).then(function(){$('rStep1').classList.add('hidden');$('rStep2').classList.remove('hidden');$('rCode').focus()})
   .catch(function(){err.textContent=t('eNet')}).then(function(){$('rSend').disabled=false});
}
function restoreVerify(){
  var c=$('rCode').value.replace(/\D/g,''),err=$('rErr2');
  if(c.length!==6){err.textContent=t('eCodeLen');return}
  err.textContent='';$('rVerify').disabled=true;
  rpc('tb_restore_verify',{p_email:restoreEmail,p_code:c,p_visited:local}).then(function(j){
    if(j.status==='ok'){setMe(j);freshStop=0;lastScanned=0;renderAll();closeSheetOv();window.scrollTo(0,0)}
    else err.textContent=t('eNoMatch');
  }).catch(function(){err.textContent=t('eNet')}).then(function(){$('rVerify').disabled=false});
}
function signOut(){me=null;ls('tb_token',null);lastScanned=0;freshStop=0;renderAll()}

/* ---------- init ---------- */
function setLang(l){lang=l;ls('tb_lang',lang);try{history.replaceState(null,'','#lang-'+l)}catch(e){}renderAll()}
function init(){
  var saved=ls('tb_lang'),h=(location.hash||'');
  lang=saved==='ar'||saved==='en'?saved:((navigator.language||'').slice(0,2)==='ar'?'ar':'en');
  if(h==='#lang-ar')lang='ar';else if(h==='#lang-en')lang='en';
  try{local=JSON.parse(ls('tb_local')||'[]').filter(function(n){return n>=1&&n<=STOPS})}catch(e){local=[]}
  $('lEn').onclick=function(){setLang('en')};$('lAr').onclick=function(){setLang('ar')};
  $('regForm').addEventListener('submit',register);
  $('mainCta').onclick=function(){openSheet('register')};
  $('toRestore').onclick=function(){openSheet('restore')};
  $('toRestore2').onclick=function(){openSheet('restore')};
  $('toJoin').onclick=function(){openSheet('register')};
  $('shClose').onclick=closeSheetOv;
  $('privLink').onclick=closeSheetOv;
  $('signOut').onclick=signOut;
  $('rSend').onclick=restoreSend;$('rVerify').onclick=restoreVerify;
  $('modal').addEventListener('click',function(e){if(e.target===$('modal'))closeSheet()});
  $('sheetOv').addEventListener('click',function(e){if(e.target===$('sheetOv'))closeSheetOv()});
  renderAll();
  rpc('tb_stats').then(function(s){setStats(s)}).catch(function(){setStats(null)});
  var params=new URLSearchParams(location.search),stop=parseInt(params.get('stop'),10);
  if(params.has('stop')){try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}}
  var tok=ls('tb_token'),p=Promise.resolve();
  if(tok)p=rpc('tb_me',{p_token:tok}).then(function(j){if(j.status==='ok')setMe(j);else ls('tb_token',null)}).catch(function(){});
  p.then(function(){renderAll();return handleStop(stop)});
}
init();
})();
